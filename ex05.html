<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Batalha das 12 Casas - Zodíaco </title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
    }

    .container {
      width: 320px;
      padding: 30px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 25px;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
      display:flex;
      align-items:flex-end;
      gap: 1px;
      margin: 10px 100px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }

    #resultado {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.4;
      color: #cbd5f5;
    }

    .vitoria {
      color: #22c55e;
    }

    .derrota {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✧ Batalha das 12 Casas</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="number" id="cosmo" placeholder="Cosmo inicial">

    <label>
      <input type="checkbox" id="sacrificio">
      Sacrificar sentidos
    </label>

    <button onclick="iniciarJornada()">Iniciar</button>

    <div id="resultado"></div>
  </div>

  <script>
    function iniciarJornada() {
      const nome = document.getElementById("nome").value;
      let cosmo = +document.getElementById("cosmo").value;

      const sacrificar = document.getElementById("sacrificio").checked;
      cosmo = sacrificar ? cosmo * 2 : cosmo;

      let casas = 12;
      let danoPorCasa = 100;

      for (let i = 1; i <= casas; i++) {
        cosmo = cosmo >= danoPorCasa ? cosmo - danoPorCasa : cosmo;
      }

      let resultadoDiv = document.getElementById("resultado");

      if (cosmo >= 1000) {
        resultadoDiv.className = "vitoria";
        resultadoDiv.innerText = `Você venceu com ${cosmo} de cosmo.`;
      } else {
        resultadoDiv.className = "derrota";
        resultadoDiv.innerText = `Derrotado. Cosmo final: ${cosmo}.`;
      }
    }
  </script>

</body>
</html>
